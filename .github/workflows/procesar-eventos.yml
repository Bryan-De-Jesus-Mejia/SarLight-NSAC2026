name: Procesar eventos SAR

# Corre solo, sin Codespace:
#   - cuando se sube un cambio a DataAnalytics/cloud/trabajos.txt (p.ej. un evento nuevo),
#   - una vez al día (reintenta lo que haya fallado),
#   - o a mano desde la pestaña Actions (Run workflow).
# Procesa los trabajos que aún no tienen análisis y sube SOLO DataAnalytics/data/analisis.
# Necesita los secrets de Actions EARTHDATA_USERNAME y EARTHDATA_PASSWORD (Settings -> Secrets and variables -> Actions).
on:
  push:
    branches: [main]
    paths: ["DataAnalytics/cloud/trabajos.txt"]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write   # push de los análisis
  actions: write    # relanzarse si se acaba el tiempo

concurrency:
  group: procesar-eventos
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: DataAnalytics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DataAnalytics/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Procesar eventos pendientes
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python cloud/run_jobs.py --pendientes --commit --limpiar-crudos --paralelo 2 --tiempo-max-min 270

      # Un push hecho con este token no dispara workflows, pero workflow_dispatch sí: así continúa solo.
      - name: Relanzar si quedaron trabajos sin empezar
        if: always() && hashFiles('DataAnalytics/cloud/logs/quedan.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run procesar-eventos.yml --ref "${{ github.ref_name }}"

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: DataAnalytics/cloud/logs/
          retention-days: 7
          if-no-files-found: ignore
